[package]
name = "azimuth-daemon"
version = "0.3.6"
edition = "2021"
authors = ["Azimuth <team@azimuth.day>"]
description = "Azimuth positioning network daemon — SDR signal observation and submission"

[lib]
# Android builds compile the crate as a cdylib (JNI .so for the Observer app).
# lib.rs is `#![cfg(target_os = "android")]` — on every other target the library
# is empty and the existing binary build is unchanged.
name = "azimuth_daemon"
crate-type = ["cdylib", "rlib"]

[features]
# udev (default) enables serialport's libudev-backed serial enumeration. It is ON by
# default, so every normal build (x86/windows/aarch64/armv7/armv6) is unchanged. Targets
# with no system libudev available (riscv64gc, whose Debian-ports libs are unreachable
# from the stock cross image) build with `--no-default-features`, dropping only udev —
# serialport falls back to sysfs enumeration. Scoped to the build invocation; not a
# shared-dependency default change.
default = ["udev"]
udev = ["serialport/libudev"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"

# SDR hardware access
# NOTE: Linux cross-build may need libusb-dev in cross-rs container — see Cross.toml
rtl-sdr-rs = { version = "0.3", features = ["rtl_sdr_blog"] }
rusb = { version = "0.9", features = ["vendored"] }

# DSP: FFT for LTE PSS/SSS detection and signal analysis
rustfft = "6"

# Serial port access for RTK GPS receiver forwarding
tokio-serial = "5.5"
nmea = "0.7"
serialport = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
# WinUSB driver detection + auto-install for RTL2832U (libwdi/Zadig backend)
wdi-rs = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
# JNI bridge for the Observer app's OTG SDR mode
jni = "0.21"
android_logger = "0.15"
log = "0.4"
# rustls on Android: openssl-sys (native-tls-vendored) cannot cross-build from
# a Windows host, and Android ships no system OpenSSL anyway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop/server targets keep the original vendored native-tls build.
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }

[profile.release]
# Reproducible, machine-independent release binaries: strip symbols. Build paths
# are additionally remapped via build-time RUSTFLAGS (see Cross.toml passthrough).
strip = "symbols"
