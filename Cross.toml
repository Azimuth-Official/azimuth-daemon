[target.x86_64-unknown-linux-gnu]
# Debian stable-based image
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:0.2.5"

# Cross-compile note: the C-linked deps (libudev-sys via serialport) resolve through
# pkg-config. cross-rs does NOT set container env from an inline `env = {...}` table;
# the working mechanism is `[target.<t>.env] passthrough = [...]` PLUS setting those
# vars on the HOST before `cross build`. The pre-build installs the :<arch> dev libs so
# the .pc files exist at /usr/lib/<multiarch-tuple>/pkgconfig (verified for aarch64).

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update",
  "apt-get install -y libusb-1.0-0-dev:arm64 libudev-dev:arm64 libssl-dev:arm64",
]
[target.aarch64-unknown-linux-gnu.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS", "PKG_CONFIG_PATH", "PKG_CONFIG_SYSROOT_DIR"]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:0.2.5"
pre-build = [
  "dpkg --add-architecture armhf",
  "apt-get update",
  "apt-get install -y libusb-1.0-0-dev:armhf libudev-dev:armhf libssl-dev:armhf",
]
[target.armv7-unknown-linux-gnueabihf.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS", "PKG_CONFIG_PATH", "PKG_CONFIG_SYSROOT_DIR"]

[target.arm-unknown-linux-gnueabihf]
# ARMv6 (Pi 1 / Zero) — best-effort
image = "ghcr.io/cross-rs/arm-unknown-linux-gnueabihf:0.2.5"
pre-build = [
  "dpkg --add-architecture armhf",
  "apt-get update",
  "apt-get install -y libusb-1.0-0-dev:armhf libudev-dev:armhf libssl-dev:armhf",
]
[target.arm-unknown-linux-gnueabihf.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS", "PKG_CONFIG_PATH", "PKG_CONFIG_SYSROOT_DIR"]

[target.riscv64gc-unknown-linux-gnu]
# RISC-V 64-bit — best-effort
image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:0.2.5"
pre-build = [
  "dpkg --add-architecture riscv64",
  "apt-get update",
  "apt-get install -y libusb-1.0-0-dev:riscv64 libudev-dev:riscv64 libssl-dev:riscv64",
]
[target.riscv64gc-unknown-linux-gnu.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS", "PKG_CONFIG_PATH", "PKG_CONFIG_SYSROOT_DIR"]
