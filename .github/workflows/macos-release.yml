name: macOS Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
        default: '0.3.1'

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS binary
        # RUSTFLAGS is set inline rather than in an `env:` block on purpose. Actions substitutes
        # `${{ }}` expressions before the step runs, but it passes `env:` values to the process
        # verbatim — it does not run them through a shell. So `$HOME` in an `env:` value would stay
        # the literal four characters `$HOME`, producing a remap rule for a directory of that name,
        # matching nothing, and scrubbing nothing. Setting it on the command line means the shell
        # expands `$HOME` while Actions still expands `${{ github.workspace }}`.
        #
        # Two rules, because the workspace rule alone was never enough: the paths that actually
        # leaked into released binaries came from dependency crates under `$HOME/.cargo/registry`,
        # embedded by `file!()` and panic metadata, not from our own sources. `$HOME` covers those
        # and `.rustup` too. The rules overlap, which only affects how the workspace path is
        # rendered — not whether the runner's home directory survives, which is the point.
        run: |
          RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=azimuth-daemon --remap-path-prefix=$HOME=/build" \
            cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Create release archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz azimuth-daemon
          shasum -a 256 azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz > azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256
          ls -lh azimuth-daemon-*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azimuth-daemon-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz
            target/${{ matrix.target }}/release/azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256
