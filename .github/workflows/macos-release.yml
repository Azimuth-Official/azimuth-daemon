name: macOS Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
        default: '0.3.1'

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=azimuth-daemon

      - name: Create release archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz azimuth-daemon
          shasum -a 256 azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz > azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256
          ls -lh azimuth-daemon-*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azimuth-daemon-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz
            target/${{ matrix.target }}/release/azimuth-daemon-${{ github.event.inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256
