# =============================================================================
# Azimuth Daemon Configuration
# Copy this file to config.toml and edit before running.
# =============================================================================

# Region code: ISO country code (US, DE, JP, ...) or "AUTO" (any case) to use the
# country that contains [node.location]. The daemon resolves this into FM/LTE/DTV
# sweep plans at startup and overrides the [scanning.*] sweep ranges below; a
# location that is not inside any known country gets the worldwide default plan
# (see "region_effective" / "region_source" in GET /status). Also settable via
# --region.
region = "AUTO"

[api]
# Azimuth API endpoint
url = "https://azimuth.day"
# Your API key (get from azimuth.day dashboard after registration)
key = "your-api-key-here"

[node]
# Leave empty for auto-registration on first run
id = ""
# Hardware tier: "tier0_mobile", "tier1_rtlsdr", "tier2_gpsdo"
hardware_type = "tier1_rtlsdr"
# Human-readable node name
label = "my-azimuth-node"

[node.location]
# Node location (used for registration; Tier 1+ nodes are stationary)
latitude = 0.0
longitude = 0.0
altitude_m = 0.0

[daemon]
# Heartbeat interval in seconds
heartbeat_interval_secs = 15
# Observation submission interval in seconds
submit_interval_secs = 30
# Status server bind address (GET /status for health check)
status_bind = "127.0.0.1:8420"

[sdr]
# Device index: specific device number, or omit to enumerate all connected RTL-SDRs
# device_index = 0
# Sample rate in Hz. 2048000 is the standard for RTL-SDR.
sample_rate = 2048000
# Fallback center frequency for legacy mode (no [scanning] section)
center_frequency = 100000000
# Gain: -1 for automatic gain control (AGC), or positive value in tenths of dB
# AGC is recommended for most setups. Manual gain useful for known-good environments.
gain = -1
# dBm calibration offset. Adjusts dBFS readings to approximate dBm.
# Default -30.0 is typical for RTL-SDR V3. Calibrate against a known signal for accuracy.
dbm_offset = -30.0

# =============================================================================
# Scanning Configuration (optional — scanning runs by default even without this
# section, using the region's sweep plans; set enabled = false for the legacy
# single-frequency mode)
# =============================================================================

[scanning]
# Master switch: false drops back to the legacy single-frequency loop
enabled = true
# Scan mode:
#   "config" = use only the frequency lists below (fast, predictable)
#   "sweep"  = auto-discover stations on first run (slower startup, finds everything)
#   "both"   = auto-discover on first run, then use discovered + config lists
mode = "both"
# Seconds between full scan cycles
interval_seconds = 30
# Scheduling weights — higher weight = more scan time allocated to that signal type.
# LTE is highest value for positioning (TDOA), so it gets the most weight by default.
weight_lte = 3
weight_dtv = 2
weight_fm = 1
# Delay in ms after frequency retune — gives RTL-SDR PLL time to lock.
# Increase to 150-200 if you see USB pipe errors in logs.
retune_delay_ms = 100
# Number of capture retries on USB errors (exponential backoff: 200/400/800ms)
capture_retries = 3
# Maximum observations submitted per scan cycle (strongest signals first)
max_observations_per_cycle = 20

[scanning.fm]
# Known FM station frequencies in Hz. Add your local stations.
# Example (Rochester MN area):
# frequencies = [92_700_000, 96_100_000, 100_300_000, 101_700_000]
frequencies = []
# Auto-sweep parameters (used when mode = "sweep" or "both")
sweep_start = 87_500_000
sweep_end = 108_000_000
sweep_step = 200_000
# Power threshold for station detection during sweep (dBFS, -20 filters noise)
sweep_threshold = -20.0
# Minimum SNR for FM station validation during sweep (dB)
sweep_min_snr_db = 8.0

[scanning.lte]
# LTE downlink center frequencies in Hz.
# Only low-band LTE works with RTL-SDR V3 (max ~1.766 GHz).
# Defaults cover the three most common US low bands:
#   Band 71 (T-Mobile 600 MHz): 617-652 MHz
#   Band 12 (T-Mobile/AT&T 700 MHz): 729-746 MHz
#   Band 5 (AT&T/US Cellular 850 MHz): 869-894 MHz
frequencies = [631_000_000, 637_000_000, 737_000_000, 881_000_000]

# Auto-sweep band ranges (used when mode = "sweep" or "both")
[[scanning.lte.sweep_bands]]
start = 617_000_000
end = 652_000_000
step = 5_000_000

[[scanning.lte.sweep_bands]]
start = 729_000_000
end = 746_000_000
step = 5_000_000

[[scanning.lte.sweep_bands]]
start = 869_000_000
end = 894_000_000
step = 5_000_000

[scanning.dtv]
# DTV channel center frequencies in Hz (ATSC, DVB-T or DVB-T2 - the region plan
# decides the standard and the channel raster).
# Leave empty to rely on auto-sweep, or add known local channels.
# The sweep range below is the ATSC default (UHF 14-36, 470-608 MHz); when `region`
# is set or "AUTO" resolves a country, that country's range replaces it.
frequencies = []
# Auto-sweep parameters
sweep_start = 470_000_000
sweep_end = 608_000_000
sweep_step = 6_000_000
sweep_threshold = -45.0
